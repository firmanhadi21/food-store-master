name: Deploy Atlas Ruang Publik to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "atlas/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ★ 本家（shiwaku/japan-food-store-master）の日本版ビューア viewer/ は
      #   **デプロイしない**。fork 元の base が /japan-food-store-master/ 固定で
      #   このリポジトリ名（food-store-master）では 404 になるため。
      #   コード自体は本家との差分を追えるよう残してある。
      - name: Build Atlas Ruang Publik
        working-directory: atlas
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: atlas/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
