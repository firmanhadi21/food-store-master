name: Deploy Atlas Ruang Publik to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "atlas/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ** The upstream Japan viewer (viewer/, from shiwaku/japan-food-store-master) is
      #   **not deployed**. Its vite base is fixed at /japan-food-store-master/, which
      #   404s under this repository's name. The code is kept so the fork can still be
      #   diffed against upstream.
      - name: Build Atlas Ruang Publik
        working-directory: atlas
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: atlas/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
